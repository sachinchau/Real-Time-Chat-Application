
{% extends "base.html" %}

{% block title %}Register | RealTime Chat{% endblock %}

{% block extra_css %}
<style>
    .register-wrapper {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .register-card {
        width: 100%;
        max-width: 440px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .register-icon {
        width: 65px;
        height: 65px;
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 15px;
    }

    .form-control {
        padding: 12px;
        border-radius: 8px;
    }

    .register-btn {
        background: #1d4ed8;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
    }

    .register-btn:hover {
        background: #1e40af;
        color: white;
    }
</style>
{% endblock %}

{% block content %}

<div class="register-wrapper">

    <div class="register-card">

        <div class="register-icon">💬</div>

        <h3 class="text-center fw-bold">Create Account</h3>

        <p class="text-center text-muted mb-4">
            Join RealTime Chat today!
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Choose a username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Create a password"
                       required>
            </div>

            <button type="submit" class="btn register-btn w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="{{ url_for('auth.login') }}"
               class="text-decoration-none fw-semibold">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
